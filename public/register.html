<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก | HarnNgeinHub</title>
    <meta name="description" content="สมัครสมาชิก HarnNgeinHub ฟรี เพื่อหารเงินกับเพื่อน">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

    <!-- ✨ Background -->
    <div class="auth-bg" aria-hidden="true">
        <div class="auth-blob blob-1"></div>
        <div class="auth-blob blob-2"></div>
    </div>

    <div class="auth-container">
        <!-- Logo / Brand -->
        <a href="/" class="auth-brand">
            <span class="auth-logo">💸</span>
            <span class="auth-brand-text">HarnNgeinHub</span>
        </a>

        <!-- Register Card -->
        <div class="auth-card">
            <h1 class="auth-title">สมัครบัญชีใหม่ 🎉</h1>
            <p class="auth-subtitle">สร้างบัญชีฟรี เริ่มหารเงินกับเพื่อนได้ทันที</p>

            <!-- Toast / Error message -->
            <div id="auth-toast" class="auth-toast hidden"></div>

            <form id="register-form" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="name">ชื่อที่แสดง</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="name" name="name"
                               placeholder="เช่น สมชาย" autocomplete="name" maxlength="100">
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">อีเมล <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="email" name="email" required
                               placeholder="you@example.com" autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">รหัสผ่าน <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" required
                               placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password" minlength="6">
                    </div>
                    <span class="form-hint">รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร</span>
                </div>
                <div class="form-group">
                    <label for="confirm-password">ยืนยันรหัสผ่าน <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="confirm-password" name="confirm-password" required
                               placeholder="กรอกรหัสผ่านอีกครั้ง" autocomplete="new-password" minlength="6">
                    </div>
                </div>
                <button type="submit" class="auth-btn auth-btn-primary" id="register-btn">
                    <span class="btn-text">สมัครสมาชิก</span>
                    <span class="btn-loading hidden">
                        <span class="spinner"></span> กำลังสมัคร...
                    </span>
                </button>
            </form>

            <div class="auth-divider">
                <span>หรือ</span>
            </div>

            <!-- Google Sign-Up -->
            <button class="auth-btn auth-btn-google" id="google-register-btn" disabled title="Google Sign-Up จะเปิดใช้เร็ว ๆ นี้">
                <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                สมัครด้วย Google (เร็ว ๆ นี้)
            </button>

            <p class="auth-footer-text">
                มีบัญชีอยู่แล้ว? <a href="/login.html" class="auth-link">เข้าสู่ระบบ →</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
